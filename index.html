<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIRE Calculator — Switching Careers</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🔥 FIRE Calculator</h1>
      <p class="subtitle">Financial Independence & Career Switching Planner</p>
    </header>

    <form id="fireForm" novalidate>
      <section class="card">
        <h2>Personal Details</h2>
        <div class="grid">
          <div class="field">
            <label for="currentAge">Current Age</label>
            <input type="number" id="currentAge" min="18" max="100" value="30" required />
          </div>
          <div class="field">
            <label for="lifeExpectancy">Life Expectancy</label>
            <input type="number" id="lifeExpectancy" min="50" max="120" value="85" required />
          </div>
          <div class="field">
            <label for="careerSwitchAge">Age to Start New Career</label>
            <input type="number" id="careerSwitchAge" min="18" max="100" value="45" required />
          </div>
          <div class="field">
            <label for="retirementAge">Desired Retirement Age</label>
            <input type="number" id="retirementAge" min="18" max="100" value="60" required />
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Income &amp; Expenses</h2>
        <div class="grid">
          <div class="field">
            <label for="monthlyIncome">Current Monthly Income ($)</label>
            <input type="number" id="monthlyIncome" min="0" value="5000" required />
          </div>
          <div class="field">
            <label for="monthlyExpenses">Current Monthly Expenses ($)</label>
            <input type="number" id="monthlyExpenses" min="0" value="3000" required />
          </div>
          <div class="field">
            <label for="newCareerIncome">Expected Monthly Income in New Career ($)</label>
            <input type="number" id="newCareerIncome" min="0" value="2000" required />
          </div>
          <div class="field">
            <label for="retiredExpenses">Expected Monthly Expenses in Retirement ($)</label>
            <input type="number" id="retiredExpenses" min="0" value="2500" required />
          </div>
          <div class="field">
            <label for="estimatedPension">Estimated Monthly Pension ($)</label>
            <input type="number" id="estimatedPension" min="0" value="800" required />
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Investments &amp; Rates</h2>
        <div class="grid">
          <div class="field">
            <label for="currentInvested">Current Invested Amount ($)</label>
            <input type="number" id="currentInvested" min="0" value="50000" required />
          </div>
          <div class="field">
            <label for="expectedReturn">Expected Annual Return (%)</label>
            <input type="number" id="expectedReturn" min="0" max="100" step="0.1" value="7" required />
          </div>
          <div class="field">
            <label for="investmentTax">Tax on Investment Returns (%)</label>
            <input type="number" id="investmentTax" min="0" max="100" step="0.1" value="15" required />
          </div>
          <div class="field">
            <label for="inflation">Estimated Annual Inflation (%)</label>
            <input type="number" id="inflation" min="0" max="100" step="0.1" value="3" required />
          </div>
        </div>
      </section>

      <div id="errorMsg" class="error-msg" aria-live="polite"></div>
      <button type="submit" class="btn-calculate">Calculate</button>
    </form>

    <section id="results" class="card results hidden">
      <h2>Your Financial Projection</h2>

      <div class="summary-grid" id="summaryGrid"></div>

      <div class="chart-wrapper">
        <canvas id="projectionChart" aria-label="Asset projection chart"></canvas>
      </div>

      <div class="phases" id="phasesDetail"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
